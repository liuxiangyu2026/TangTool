name: Build desktop with document sidecar
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            architecture: arm64
            bundles: app
            python: .venv-sidecar/bin/python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
            bundles: app
            python: .venv-sidecar/bin/python
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            architecture: x64
            bundles: nsis
            python: .venv-sidecar/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.architecture }}
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m venv .venv-sidecar
      - name: Install locked sidecar dependencies
        run: ${{ matrix.python }} -m pip install --require-hashes -r sidecar/requirements.lock
      - run: npm ci
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Archive macOS application (preserve executable bits and symlinks)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/TangTool.app TangTool-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TangTool-${{ matrix.target }}
          if-no-files-found: error
          path: |
            TangTool-*.zip
            src-tauri/target/release/bundle/nsis/*.exe
