name: Build desktop with document sidecar
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            architecture: arm64
            bundles: app
            python: .venv-sidecar/bin/python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
            bundles: app
            python: .venv-sidecar/bin/python
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            architecture: x64
            bundles: nsis
            python: .venv-sidecar/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.architecture }}
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: python -m venv .venv-sidecar
      - name: Install locked sidecar dependencies
        run: ${{ matrix.python }} -m pip install --require-hashes -r sidecar/requirements.lock
      - run: npm ci
      - run: npm test
      - run: npm run site:build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify dependency locks did not change
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Collect candidate package and SHA-256 checksums
        run: npm run release:collect
      - uses: actions/upload-artifact@v4
        with:
          name: TangTool-${{ matrix.target }}
          if-no-files-found: error
          path: release-artifacts/${{ matrix.target }}/
