name: Publish verified desktop artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful desktop-build run ID
        required: true
        type: string
      commit:
        description: Full source commit of that build
        required: true
        type: string
      release_id:
        description: Existing draft release ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: TangTool-*
          path: release-input
      - name: Verify, upload and publish preview
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          BUILD_COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-release.cjs');
            await publish({ github, context, core });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-verification
          path: release-input/public-verification.json
          if-no-files-found: ignore
