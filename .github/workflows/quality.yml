name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run site:build
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - run: git diff --exit-code -- package-lock.json

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri
      - run: git diff --exit-code -- src-tauri/Cargo.lock
